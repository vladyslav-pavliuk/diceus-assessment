@if (messages().length > 0) {
  <div class="banner banner--error" role="alert">
    <mat-icon>error_outline</mat-icon>
    <div>
      <strong>{{ title() }}</strong>
      <ul>
        @for (message of messages(); track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    </div>
  </div>
}
